<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060814" />
      <stop offset="50%" stop-color="#0b0f1f" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <radialGradient id="cyanSpot" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#00FFCC" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleSpot" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#9D4EDD" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#3A0CA3" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Title Gradient -->
    <linearGradient id="neonTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFCC" />
      <stop offset="30%" stop-color="#38E1FF" />
      <stop offset="70%" stop-color="#B5179E" />
      <stop offset="100%" stop-color="#7209B7" />
    </linearGradient>

    <!-- Cyber Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#7209B7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3A0CA3" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A0CA3" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#9D4EDD" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00FFCC" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0" />
      <stop offset="25%" stop-color="#00FFCC" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#D946EF" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#7209B7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7209B7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFCC" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#7209B7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00FFCC" stop-opacity="0.7" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00FFCC" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>

    <!-- Glow Filter for High-Impact Neon -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Montserrat', 'Inter', sans-serif;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 9px;
      text-transform: uppercase;
    }
    .subtitle-text {
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 4.5px;
    }
    .hud-text {
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
    }
    .badge-text {
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 3px;
    }
  </style>

  <!-- 1. Deep Space Base Background -->
  <rect width="1200" height="320" rx="14" fill="url(#bgGrad)" />

  <!-- 2. Cyber Grid Overlay -->
  <rect width="1200" height="320" rx="14" fill="url(#cyberGrid)" />

  <!-- 3. Ambient Neon Spotlights -->
  <rect width="1200" height="320" rx="14" fill="url(#cyanSpot)" />
  <rect width="1200" height="320" rx="14" fill="url(#purpleSpot)" />

  <!-- 4. Cyberpunk Horizon / Perspective Rays -->
  <g opacity="0.18">
    <line x1="600" y1="160" x2="-200" y2="320" stroke="#00FFCC" stroke-width="1.2" />
    <line x1="600" y1="160" x2="100" y2="320" stroke="#00FFCC" stroke-width="1" />
    <line x1="600" y1="160" x2="350" y2="320" stroke="#00FFCC" stroke-width="0.8" />
    <line x1="600" y1="160" x2="850" y2="320" stroke="#9D4EDD" stroke-width="0.8" />
    <line x1="600" y1="160" x2="1100" y2="320" stroke="#9D4EDD" stroke-width="1" />
    <line x1="600" y1="160" x2="1400" y2="320" stroke="#9D4EDD" stroke-width="1.2" />
  </g>

  <!-- 5. Flowing Cyber Neon Waves -->
  <!-- Bottom Wave 1 -->
  <path d="M 0,260 Q 250,190 550,250 T 1200,220 L 1200,320 L 0,320 Z" fill="url(#waveGrad1)" />
  <!-- Bottom Wave 2 (layered) -->
  <path d="M 0,285 Q 350,220 700,275 T 1200,260 L 1200,320 L 0,320 Z" fill="url(#waveGrad2)" />
  <!-- Crisp Neon Wave Lines -->
  <path d="M 0,260 Q 250,190 550,250 T 1200,220" fill="none" stroke="#00FFCC" stroke-width="2.2" stroke-opacity="0.75" filter="url(#softGlow)" />
  <path d="M 0,285 Q 350,220 700,275 T 1200,260" fill="none" stroke="#BD00FF" stroke-width="1.8" stroke-opacity="0.65" filter="url(#softGlow)" />

  <!-- 6. Outer Neon HUD Border -->
  <rect x="14" y="14" width="1172" height="292" rx="10" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" opacity="0.6" />

  <!-- 7. Futuristic Corner HUD Brackets -->
  <!-- Top Left -->
  <path d="M 14,46 L 14,14 L 46,14" fill="none" stroke="#00FFCC" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="28" cy="28" r="2.5" fill="#00FFCC" filter="url(#softGlow)" />
  <!-- Top Right -->
  <path d="M 1154,14 L 1186,14 L 1186,46" fill="none" stroke="#BD00FF" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="1172" cy="28" r="2.5" fill="#BD00FF" filter="url(#softGlow)" />
  <!-- Bottom Left -->
  <path d="M 14,274 L 14,306 L 46,306" fill="none" stroke="#00FFCC" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="28" cy="292" r="2.5" fill="#00FFCC" filter="url(#softGlow)" />
  <!-- Bottom Right -->
  <path d="M 1154,306 L 1186,306 L 1186,274" fill="none" stroke="#BD00FF" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="1172" cy="292" r="2.5" fill="#BD00FF" filter="url(#softGlow)" />

  <!-- 8. Top HUD Status Bar -->
  <g transform="translate(48, 38)">
    <!-- Left status -->
    <circle cx="4" cy="-4" r="3.5" fill="#00FFCC" filter="url(#softGlow)" />
    <text x="16" y="0" class="hud-text" fill="#00FFCC" opacity="0.9">SYSTEM:// ONLINE</text>
    <text x="165" y="0" class="hud-text" fill="#7209B7" opacity="0.8">•</text>
    <text x="180" y="0" class="hud-text" fill="#A78BFA" opacity="0.75">DEV.ENV // ACTIVATED</text>
  </g>

  <g transform="translate(870, 38)">
    <!-- Right status -->
    <text x="0" y="0" class="hud-text" fill="#A78BFA" opacity="0.75">&lt; PROTOCOL: CREATIVE_WEB /&gt;</text>
    <circle cx="270" cy="-4" r="3.5" fill="#BD00FF" filter="url(#softGlow)" />
  </g>

  <!-- 9. Subtle Tech Crosshairs -->
  <g opacity="0.4" stroke="#00FFCC" stroke-width="1">
    <path d="M 100,105 L 100,115 M 95,110 L 105,110" />
    <path d="M 1100,105 L 1100,115 M 1095,110 L 1105,110" />
  </g>

  <!-- 10. Central Identity Section -->
  <!-- Ambient Backlight for Title -->
  <text x="600" y="145" text-anchor="middle" class="title-text" fill="#00FFCC" opacity="0.35" filter="url(#neonGlow)">ATALAY EGE KARA</text>
  <!-- Foreground Neon Title -->
  <text x="600" y="145" text-anchor="middle" class="title-text" fill="url(#neonTitleGrad)">ATALAY EGE KARA</text>

  <!-- High-Tech Divider Line -->
  <line x1="260" y1="172" x2="940" y2="172" stroke="url(#lineGrad)" stroke-width="2.5" filter="url(#softGlow)" />
  <!-- Center Accent Diamond on Divider -->
  <polygon points="600,167 605,172 600,177 595,172" fill="#00FFCC" filter="url(#softGlow)" />

  <!-- Subtitle -->
  <text x="600" y="210" text-anchor="middle" class="subtitle-text" fill="#00FFCC" filter="url(#softGlow)">
    ⚡ FRONTEND &amp; CREATIVE WEB EXPLORER ⚡
  </text>

  <!-- Technical Tags Footer -->
  <g transform="translate(600, 248)">
    <text x="0" y="0" text-anchor="middle" class="badge-text" fill="#C4B5FD" opacity="0.88">
      [ JAVASCRIPT • HTML5 CANVAS • WEB AUDIO • MODERN UI ]
    </text>
  </g>

  <!-- 11. Subtle Bottom HUD Accents -->
  <g transform="translate(48, 290)">
    <text x="0" y="0" class="hud-text" fill="#00FFCC" opacity="0.65">ID: ATALYY // REPO: PROFILE</text>
  </g>
  <g transform="translate(1030, 290)">
    <text x="0" y="0" class="hud-text" fill="#A78BFA" opacity="0.65">VERSION 2026.1 // LIVE</text>
  </g>
</svg>
